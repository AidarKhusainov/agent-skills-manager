name: Validate plugin source

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, agent/workflow-redesign]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-validation.txt
      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Syntax check
        run: python -m compileall -q scripts tests
      - name: Validator regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate actual plugin package
        run: python scripts/validate.py
